name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false

jobs:
  build-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build release APK
        run: nix develop --command ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: apk-a
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  build-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build release APK
        run: nix develop --command ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: apk-b
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Run unit tests
        run: nix develop --command ./gradlew --no-daemon test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/

  reproducible:
    runs-on: ubuntu-latest
    needs: [build-a, build-b]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: actions/download-artifact@v8
        with:
          name: apk-a
          path: apk-a
      - uses: actions/download-artifact@v8
        with:
          name: apk-b
          path: apk-b
      - name: Compare checksums
        run: |
          sha256sum apk-a/app-release.apk apk-b/app-release.apk | tee checksums.txt
          HASH_A=$(sha256sum apk-a/app-release.apk | cut -d' ' -f1)
          HASH_B=$(sha256sum apk-b/app-release.apk | cut -d' ' -f1)
          if [ "$HASH_A" = "$HASH_B" ]; then
            echo "REPRODUCIBLE=true" >> "$GITHUB_ENV"
            echo "Builds are identical."
          else
            echo "REPRODUCIBLE=false" >> "$GITHUB_ENV"
            echo "Builds differ."
          fi
      - name: Diff APKs
        if: env.REPRODUCIBLE == 'false'
        run: |
          nix run nixpkgs#diffoscope -- \
            apk-a/app-release.apk apk-b/app-release.apk \
            --html report.html --text report.txt \
            || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reproducibility-report
          path: |
            checksums.txt
            report.html
            report.txt
      - name: Fail on non-reproducible build
        if: env.REPRODUCIBLE == 'false'
        run: exit 1

  publish:
    runs-on: ubuntu-latest
    needs: [build-a, build-b, test, reproducible]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Decode signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          KEYSTORE_PATH=$(mktemp -p "$RUNNER_TEMP" release-XXXXXXXX.keystore)
          echo "$RELEASE_KEYSTORE" | base64 -d > "$KEYSTORE_PATH"
          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: nix develop --command ./gradlew --no-daemon --quiet assembleRelease
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/devtoggles-$TAG.apk"
          gh release create "$TAG" "$RUNNER_TEMP/devtoggles-$TAG.apk" \
            --generate-notes \
            --title "$TAG"
      - name: Clean up signing key
        if: always()
        run: rm -f "$RELEASE_KEYSTORE_PATH"

